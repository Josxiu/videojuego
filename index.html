<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14162e" />
    <meta name="description" content="Trasnocho: el último tren nocturno de Bogotá a Santa Marta y los sueños de sus pasajeros." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%2314162e%22/><circle cx=%2250%22 cy=%2250%22 r=%2216%22 fill=%22%23ff5fa2%22/></svg>"
    />
    <title>Trasnocho</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #14162e;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        position: relative;
      }
      /* El sueño en 3D dibuja en un lienzo debajo del de Phaser. */
      #three {
        position: absolute;
        pointer-events: none;
      }
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #14162e;
        color: #ff5fa2;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font: 600 20px 'Trebuchet MS', sans-serif;
        text-align: center;
      }
      #rotate-overlay .phone {
        width: 46px;
        height: 80px;
        border: 5px solid #ffd23f;
        border-radius: 10px;
        animation: rotate-hint 1.8s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%,
        25% {
          transform: rotate(0deg);
        }
        65%,
        100% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-overlay">
      <div class="phone"></div>
      <div>Gira el celular<br />El Lucero viaja en horizontal</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
