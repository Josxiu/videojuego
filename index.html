<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0a1e" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>"
    />
    <title>Duermevela</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d0a1e;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* Aviso para girar el celular a horizontal */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #0d0a1e;
        color: #cfc4ff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: monospace;
        text-align: center;
      }
      #rotate-overlay .phone {
        font-size: 48px;
        animation: rotate-hint 1.6s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%,
        20% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: portrait) and (max-width: 600px) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-overlay">
      <div class="phone">📱</div>
      <div>Gira tu celular para jugar<br />(horizontal)</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
